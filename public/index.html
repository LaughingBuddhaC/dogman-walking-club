/* Layout: Bauhaus poster. Hard edges, thick rules, one orange field, geometry instead of decoration. */
:root{
  --bg:#faf8f5; --panel:#ffffff; --ink:#0e0c0a; --muted:#645d55; --line:#0e0c0a; --soft:#e4dfd8;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0c0a;--panel:#191613;--ink:#f3efe9;--muted:#a79f95;--line:#f3efe9;--soft:#3a342e;--ok:#6fcf8f;--err:#ff8a70;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0c0a;--panel:#191613;--ink:#f3efe9;--muted:#a79f95;--line:#f3efe9;--soft:#3a342e;--ok:#6fcf8f;--err:#ff8a70;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--body)}
.wrap{max-width:1080px;margin:0 auto;padding-inline:20px}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:.95;margin:0;letter-spacing:.01em;text-wrap:balance}
h1{font-size:clamp(3.4rem,13vw,8rem)}
h2{font-size:clamp(2.2rem,6vw,3.6rem)}
h3{font-size:1.7rem}
p{margin:0;max-width:62ch}
.label{font:500 .74rem/1.2 var(--mono);text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;border-bottom:3px solid var(--line);flex-wrap:wrap}
.brand{font:400 1.5rem/1 var(--display);letter-spacing:.04em;display:flex;align-items:center;gap:10px}
.brand i{width:18px;height:18px;border-radius:50%;background:var(--accent);display:block}
.nav{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.nav a{font:500 .8rem var(--mono);text-transform:uppercase;letter-spacing:.08em;text-decoration:none}
.nav a:hover{color:var(--accent)}
.lang{display:flex;border:2px solid var(--line)}
.lang button{font:500 .78rem var(--mono);padding:6px 10px;border:0;background:transparent;color:var(--ink);cursor:pointer}

.btn{display:inline-block;font:400 1.35rem/1 var(--display);letter-spacing:.05em;padding:14px 22px;background:var(--accent);color:var(--on-accent);border:3px solid var(--line);text-decoration:none;cursor:pointer}
.btn:hover{background:var(--ink);color:var(--bg)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink)}
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:28px;padding-block:44px;align-items:end}
.hero>*{min-width:0}
.hero .lead{font-size:1.15rem;margin-block:18px 24px}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap}
.art{position:relative;aspect-ratio:1;max-width:100%;border:3px solid var(--line);background:var(--gold);overflow:hidden}
.art .c{position:absolute;left:14%;top:14%;width:58%;height:58%;border-radius:50%;background:var(--accent)}
.art .s{position:absolute;right:0;bottom:0;width:44%;height:44%;background:#0e0c0a}
.art .q{position:absolute;right:0;bottom:0;width:44%;height:44%;background:#faf8f5;border-top-left-radius:100%}
.art .l{position:absolute;left:0;bottom:22%;width:56%;height:3px;background:#0e0c0a}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.demo{background:var(--gold);color:#0e0c0a;border:3px solid var(--line);padding:10px 14px;margin-top:18px;font:500 .85rem var(--mono)}
section{padding-block:44px;border-top:3px solid var(--line)}
.head{display:flex;flex-direction:column;gap:8px;margin-bottom:24px}
.services{display:grid;grid-template-columns:repeat(4,1fr);border:3px solid var(--line)}
.svc{padding:20px;display:flex;flex-direction:column;gap:10px;border-right:3px solid var(--line);min-width:0;background:var(--panel)}
.svc:last-child{border-right:0}
.svc p{font-size:.95rem;color:var(--muted);flex:1}
.price{font:500 .9rem var(--mono);padding-top:10px;border-top:2px solid var(--soft)}
.price b{font:400 2rem/1 var(--display);color:var(--accent);margin-right:4px}
.book{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.book>*{min-width:0}
.step{display:flex;flex-direction:column;gap:12px;margin-bottom:28px}
.step-h{display:flex;align-items:baseline;gap:10px}
.step-h span{font:400 1.6rem/1 var(--display);background:var(--ink);color:var(--bg);width:34px;height:34px;display:grid;place-items:center;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:500 .9rem var(--body);padding:10px 14px;border:2px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{padding:8px 2px;border:2px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;text-align:center;font:500 .7rem var(--mono);text-transform:uppercase}
.day b{display:block;font:400 1.5rem/1.1 var(--display)}
.day[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.day[disabled]{opacity:.3;cursor:not-allowed}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:6px}
.slot{padding:10px 4px;border:2px solid var(--line);background:var(--panel);color:var(--ink);font:500 .9rem var(--mono);font-variant-numeric:tabular-nums;cursor:pointer}
.slot[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.slot[disabled]{border-color:var(--soft);color:var(--muted);text-decoration:line-through;cursor:not-allowed;background:transparent}
form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f.full{grid-column:1/-1}
.f input,.f select,.f textarea{font:400 1rem var(--body);padding:11px 12px;border:2px solid var(--line);background:var(--panel);color:var(--ink);border-radius:0;width:100%}
.hp{position:absolute;left:-9999px}
.summary{border:3px solid var(--line);background:var(--panel);padding:16px;font:500 .9rem var(--mono);display:flex;flex-direction:column;gap:4px}
.msg{font-weight:500}.msg.err{color:var(--err)}
.done{border:3px solid var(--line);background:var(--accent);color:var(--on-accent);padding:24px;display:flex;flex-direction:column;gap:10px}
.done .mp{font:500 1.05rem var(--mono);background:#0e0c0a;color:#faf8f5;padding:10px 12px;align-self:flex-start;user-select:all}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;counter-reset:n}
.how li{list-style:none;counter-increment:n;border-top:3px solid var(--line);padding-top:12px;min-width:0}
.how li::before{content:counter(n);font:400 3rem/1 var(--display);color:var(--accent);display:block}
.how{padding:0;margin:0}
.about{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.about>*{min-width:0}
.facts{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:.95rem;margin:0}
.facts dt{font:500 .74rem var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding-top:3px}
.facts dd{margin:0}
.club{background:var(--ink);color:var(--bg);border:0}
.club .label{color:var(--gold)}
.club p{margin-top:12px}
footer{padding-block:24px;border-top:3px solid var(--line);display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap;font:400 .8rem var(--mono);color:var(--muted)}
@media (max-width:820px){
  .hero,.book,.about{grid-template-columns:1fr}
  .art{max-width:340px}
  .services{grid-template-columns:1fr 1fr}
  .svc:nth-child(2){border-right:0}.svc:nth-child(-n+2){border-bottom:3px solid var(--line)}
  .how{grid-template-columns:1fr}

@media (max-width:480px){.services{grid-template-columns:1fr}.svc{border-right:0;border-bottom:3px solid var(--line)}.svc:last-child{border-bottom:0}form{grid-template-columns:1fr}.nav a{display:none}}
</style>

  <section>

  </section>

  <section id="about">

  </section>
</div>

    if(s.price!=null){const b=document.createElement('b');b.textContent=s.price;pr.append(b,t(s.id+'U'))}else pr.textContent=t('noPrice');
    d.append(h,p,pr);return d}));
  $('svc-chips').replaceChildren(...S.config.services.map(s=>{const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=t(s.id);b.setAttribute('aria-pressed',s.id===S.service);b.onclick=()=>{S.service=s.id;if(svc().mode!=='slot')S.time=null;render()};return b}));
  const start=parse(S.today);start.setDate(start.getDate()+S.week*7);const days=[];
  for(let i=0;i<7;i++){const d=new Date(start);d.setDate(d.getDate()+i);days.push(iso(d))}
  $('week-label').textContent=fmtDate(days[0])+' – '+fmtDate(days[6]);
  $('days').replaceChildren(...days.map(d=>{const b=document.createElement('button');b.type='button';b.className='day';
    const dt=parse(d);b.append(dt.toLocaleDateString(lang==='da'?'da-DK':'en-GB',{weekday:'short'}));const n=document.createElement('b');n.textContent=dt.getDate();b.append(n);
    b.disabled=!dayOpen(d);b.setAttribute('aria-pressed',d===S.date);b.setAttribute('aria-label',fmtDate(d));b.onclick=()=>{S.date=d;S.time=null;render()};return b}));
  $('prev').disabled=S.week===0;$('next').disabled=S.week>=7;
  const mode=svc().mode;$('slot-area').hidden=mode!=='slot';$('nights-area').hidden=mode!=='nights';
  if(mode==='slot'){const list=S.date?slotsFor(S.date):[];
    if(S.date&&!list.some(x=>x.free)){const p=document.createElement('p');p.className='label';p.textContent=t('noSlots');$('slots').replaceChildren(p)}
    else $('slots').replaceChildren(...list.map(x=>{const b=document.createElement('button');b.type='button';b.className='slot';b.textContent=x.time;b.disabled=!x.free;b.setAttribute('aria-pressed',x.time===S.time);b.onclick=()=>{S.time=x.time;render()};return b}))}
  const ready=S.date&&(mode!=='slot'||S.time);
  const lines=ready?[t(S.service),fmtDate(S.date)+(S.time?' · '+S.time:'')+(mode==='nights'?' · '+$('nights').value+' '+t('nightsN'):''),svc().price!=null?svc().price+' '+t(S.service+'U'):t('noPrice')]:[t('sumPick')];
  $('summary').replaceChildren(...lines.map(l=>{const d=document.createElement('div');d.textContent=l;return d}));
}
function pickFirstDay(){for(let i=0;i<14;i++){const d=parse(S.today);d.setDate(d.getDate()+i);const s=iso(d);if(dayOpen(s)&&slotsFor(s).some(x=>x.free)){S.date=s;S.week=Math.floor(i/7);return}}}
async function load(){try{const r=await fetch('/api/public');if(!r.ok)throw 0;const j=await r.json();S.config=j.config;S.today=j.today;S.taken=new Set(j.taken);S.live=true}catch(e){S.live=false}
  if(!S.date||!dayOpen(S.date))pickFirstDay();render()}

document.querySelectorAll('.lang button').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;try{localStorage.setItem('lang',lang)}catch(e){}render()});
$('prev').onclick=()=>{S.week=Math.max(0,S.week-1);render()};$('next').onclick=()=>{S.week=Math.min(7,S.week+1);render()};
$('nights').oninput=render;
$('again').onclick=()=>{$('done').hidden=true;$('book-ui').hidden=false;S.time=null;load()};
$('form').onsubmit=async(e)=>{e.preventDefault();const msg=$('msg');msg.className='msg err';
  const v=(id)=>$(id).value.trim();
  if(!S.date||(svc().mode==='slot'&&!S.time)){msg.textContent=t('eTime');return}
  if(!v('name')||v('phone').replace(/\D/g,'').length<8){msg.textContent=t('eContact');return}
  const body={service:S.service,date:S.date,time:S.time,nights:v('nights'),name:v('name'),phone:v('phone'),email:v('email'),address:v('address'),dog:v('dog'),breed:v('breed'),size:v('size'),notes:v('notes'),website:v('website'),lang};
  const btn=$('submit');btn.disabled=true;btn.textContent=t('sending');msg.textContent='';
  let mp=S.config.mobilepay,ok=!S.live,err='eServer';
  if(S.live){try{const r=await fetch('/api/book',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();
    if(r.ok){ok=true;mp=j.mobilepay||mp}else err={taken:'eTaken',time:'eTime',contact:'eContact',closed:'eClosed',date:'eClosed'}[j.error]||'eServer'}catch(x){}}
  btn.disabled=false;btn.textContent=t('send');
  if(!ok){msg.textContent=t(err);if(err==='eTaken'){S.time=null;load()}return}
  $('done-text').textContent=t(S.service)+' · '+fmtDate(S.date)+(S.time?' · '+S.time:'')+'. '+t('doneText');
  $('mp-box').hidden=!mp;$('mp-num').textContent=mp;$('book-ui').hidden=true;$('done').hidden=false;$('done').scrollIntoView({block:'center'});
};
pickFirstDay();render();load();
</script>

</body></html>
