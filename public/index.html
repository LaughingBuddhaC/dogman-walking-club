<style>
/* Soft UI: one surface colour, depth from paired light/dark shadows. Raised = tappable, inset = chosen or input. */
:root{

}

:root[data-theme="dark"]{--bg:#23262c;--text:#f5f5f7;--muted:#a1a1a8;--sh-d:#16181c;--sh-l:#30343c;--accent:#ffab66;--title-grad:linear-gradient(90deg,#ffb067,#ffd27a);--ok:#5fd08a;--err:#ff8a70;color-scheme:dark}

  google.accounts.id.renderButton($('gbtn'),{theme:matchMedia('(prefers-color-scheme: dark)').matches?'filled_black':'outline',size:'large',shape:'pill',text:'continue_with',locale:lang,width:260})}
function loadGis(){if(!S.config.googleClientId||U.gis)return;U.gis=true;const sc=document.createElement('script');sc.src='https://accounts.google.com/gsi/client';sc.async=true;
  sc.onload=()=>{google.accounts.id.initialize({client_id:S.config.googleClientId,use_fedcm_for_prompt:true,callback:async(r)=>{
    if(await account({action:'login',credential:r.credential})){prefill();render()}else{const m=$('msg');m.className='f full msg err';m.textContent=t('eLogin')}}});drawGbtn()};
  document.head.append(sc)}
function renderAcct(){
  $('acct').hidden=!S.config.googleClientId&&!U.user;
  $('acct-out').hidden=!!U.user;$('acct-in').hidden=!U.user;
  if(U.user){$('acct-name').textContent=U.user.name||U.user.email;$('acct-email').textContent=U.user.email;$('acct-pic').hidden=!U.user.picture;if(U.user.picture)$('acct-pic').src=U.user.picture}
  const list=U.bookings.filter(b=>b.status!=='cancelled');
  $('mine').hidden=!U.user||!list.length;
  $('mine-list').replaceChildren(...list.map(b=>{const r=el('div','mrow'),l=el('div');
    l.append(el('b',null,fmtDate(b.date)+(b.time?' · '+b.time:'')),el('div','small',[t('walk'),b.pets>1?b.pets+' '+t('dogN'):'',b.estimate!=null?kr(b.estimate):''].filter(Boolean).join(' · ')));
    const c=el('button','link',t('cancel'));c.type='button';c.onclick=async()=>{if(!c.dataset.sure){c.dataset.sure=1;c.textContent=t('sure');return}await account({action:'cancel',id:b.id});load()};
    const right=el('div');right.style.cssText='display:flex;gap:12px;align-items:center';right.append(el('span','st '+b.status,t('st_'+b.status)),c);
    r.append(l,right);return r}));
}
function render(){
  const w=walk();
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
  document.querySelectorAll('[data-ta]').forEach(e=>e.setAttribute(e.tagName==='IMG'?'alt':'aria-label',t(e.dataset.ta)));
  document.querySelectorAll('[data-check]').forEach(e=>{e.innerHTML=ICON.check;e.append(el('span',null,t(e.dataset.check)))});
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));
  // Lead contains <b>: build it from escaped parts.
  const lp=t('lead').split(/(<b>.*?<\/b>)/);$('lead').replaceChildren(...lp.filter(Boolean).map(x=>x.startsWith('<b>')?el('b',null,x.slice(3,-4).replace('{p}',w.price!=null?kr(w.price):'')):document.createTextNode(x)));
  $('walk-price').textContent=w.price!=null?kr(w.price):'—';
  $('walk-extra').hidden=w.extra==null;$('walk-extra').textContent=t('extra').replace('{n}',w.extra);
  $('hours').textContent=t('hoursV').replace('{a}',pad(S.config.hours.start)+':00').replace('{b}',pad(S.config.hours.end)+':00');
  $('pawshake').href=S.config.pawshake;$('demo').hidden=S.live;
  $('phone-row').hidden=!S.config.phone;$('phone-dd').textContent=S.config.phone;
  $('others').replaceChildren(...S.config.services.filter(s=>s.id!=='walk').map(s=>{const r=el('div','orow');const l=el('div');l.append(el('b',null,t(s.id)));
    if(s.extra!=null){l.append(document.createElement('br'),el('span',null,t('xPet').replace('{n}',s.extra)))}
    r.append(l,el('div','p',s.price!=null?kr(s.price)+' '+t(s.mode==='nights'?'uNight':'uDay'):'—'));return r}));
  const start=parse(S.today);start.setDate(start.getDate()+S.week*7);const days=[];
  for(let i=0;i<7;i++){const d=new Date(start);d.setDate(d.getDate()+i);days.push(iso(d))}
  const short=(s)=>parse(s).toLocaleDateString(lang==='da'?'da-DK':'en-GB',{day:'numeric',month:'short'});
  $('week-label').textContent=short(days[0])+' – '+short(days[6]);
  $('days').replaceChildren(...days.map(d=>{const b=el('button','day');b.type='button';
    const dt=parse(d);b.append(dt.toLocaleDateString(lang==='da'?'da-DK':'en-GB',{weekday:'short'}).replace('.',''));b.append(el('b',null,dt.getDate()));
    b.disabled=!dayOpen(d);b.setAttribute('aria-pressed',d===S.date);b.setAttribute('aria-label',fmtDate(d));b.onclick=()=>{S.date=d;S.time=null;render()};return b}));
  $('prev').disabled=S.week===0;$('next').disabled=S.week>=7;
  const list=S.date?slotsFor(S.date):[];
  if(S.date&&!list.some(x=>x.free))$('slots').replaceChildren(el('p','small',t('noSlots')));
  else $('slots').replaceChildren(...list.map(x=>{const b=el('button','slot',x.time);b.type='button';b.disabled=!x.free;b.setAttribute('aria-pressed',x.time===S.time);b.onclick=()=>{S.time=x.time;render()};return b}));
  $('pets').textContent=S.pets;$('pets-minus').disabled=S.pets<=1;$('pets-plus').disabled=S.pets>=4;
  $('freq').replaceChildren(...['once','weekly','multi'].map(f=>{const b=el('button','chip',t(f));b.type='button';b.setAttribute('aria-pressed',f===S.freq);b.onclick=()=>{S.freq=f;render()};return b}));
  renderAcct();
  const sum=$('summary');
  if(!S.date||!S.time)sum.replaceChildren(el('div','muted',t('sumPick')));
  else{const p=price(),row=el('div','est');row.append(el('span','muted',t('est')),el('b',null,p!=null?kr(p):'—'));
    sum.replaceChildren(el('div','s1',t('walk')),el('div','muted',[fmtDate(S.date)+' · '+S.time,S.pets+' '+t(S.pets===1?'dog1':'dogN'),t(S.freq)].join(' · ')),row)}
}
function pickFirstDay(){for(let i=0;i<14;i++){const d=parse(S.today);d.setDate(d.getDate()+i);const s=iso(d);if(dayOpen(s)&&slotsFor(s).some(x=>x.free)){S.date=s;S.week=Math.floor(i/7);return}}}
async function load(){try{const r=await fetch('/api/public');if(!r.ok)throw 0;const j=await r.json();S.config=j.config;S.today=j.today;S.taken=new Set(j.taken);S.live=true}catch(e){S.live=false}
  if(!S.date||!dayOpen(S.date))pickFirstDay();render();loadGis()}

document.querySelectorAll('[data-icon]').forEach(e=>e.innerHTML=ICON[e.dataset.icon]);
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;try{localStorage.setItem('lang',lang)}catch(e){}render();drawGbtn()});
$('prev').onclick=()=>{S.week=Math.max(0,S.week-1);render()};$('next').onclick=()=>{S.week=Math.min(7,S.week+1);render()};
$('pets-minus').onclick=()=>{S.pets=Math.max(1,S.pets-1);render()};$('pets-plus').onclick=()=>{S.pets=Math.min(4,S.pets+1);render()};
$('logout').onclick=async()=>{await account({action:'logout'});try{google.accounts.id.disableAutoSelect()}catch(e){}render();drawGbtn()};
$('again').onclick=()=>{$('done').hidden=true;$('book-ui').hidden=false;S.time=null;load()};
$('form').onsubmit=async(e)=>{e.preventDefault();const msg=$('msg');msg.className='f full msg err';
  const v=(id)=>$(id).value.trim();
  if(!S.date||!S.time){msg.textContent=t('eTime');return}
  if(!v('name')||v('phone').replace(/\D/g,'').length<8){msg.textContent=t('eContact');return}
  const body={service:'walk',date:S.date,time:S.time,pets:S.pets,freq:S.freq,name:v('name'),phone:v('phone'),email:v('email'),address:v('address'),dog:v('dog'),breed:v('breed'),size:v('size'),notes:v('notes'),website:v('website'),lang};
  const btn=$('submit');btn.disabled=true;btn.textContent=t('sending');msg.textContent='';
  let mp=S.config.mobilepay,ok=!S.live,err='eServer';
  if(S.live){try{const r=await fetch('/api/book',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();
    if(r.ok){ok=true;mp=j.mobilepay||mp;if(U.user)account().then(render)}else err={taken:'eTaken',time:'eTime',contact:'eContact',closed:'eClosed',date:'eClosed'}[j.error]||'eServer'}catch(x){}}
  btn.disabled=false;btn.textContent=t('send');
  if(!ok){msg.textContent=t(err);if(err==='eTaken'){S.time=null;load()}return}
  const p=price();
  $('done-text').textContent=fmtDate(S.date)+' · '+S.time+(p!=null?' · '+kr(p):'')+' — '+t('doneText');
  $('mp-box').hidden=!mp;$('mp-num').textContent=mp;$('book-ui').hidden=true;$('done').hidden=false;$('done').scrollIntoView({block:'center'});
};
// Hide the floating mobile button while the booking section is on screen.
if('IntersectionObserver' in window){
  new IntersectionObserver(es=>es.forEach(x=>$('mobile-cta').classList.toggle('away',x.isIntersecting)),{threshold:.05}).observe($('book'));
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches){
    document.documentElement.classList.add('anim');
    const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}),{threshold:.12});
    document.querySelectorAll('.reveal').forEach(x=>io.observe(x));
  }
}
pickFirstDay();render();load();account().then(()=>{prefill();render()});
</script>

</body></html>
