<title>DogMan Admin</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/img/brand/favicon-64.png">
<link rel="apple-touch-icon" href="/img/brand/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#e7ebf0;--text:#1d1d1f;--muted:#62636a;--sh-d:#c3cad4;--sh-l:#fff;--accent:#b44d08;--grad:linear-gradient(135deg,#ffad5c,#f07a1e);--ok:#1f7a45;--err:#b8311a;
  --raise:8px 8px 18px var(--sh-d),-8px -8px 18px var(--sh-l);--raise-sm:4px 4px 9px var(--sh-d),-4px -4px 9px var(--sh-l);--inset-sm:inset 3px 3px 6px var(--sh-d),inset -3px -3px 6px var(--sh-l)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#23262c;--text:#f5f5f7;--muted:#a1a1a8;--sh-d:#16181c;--sh-l:#30343c;--accent:#ffab66;--ok:#5fd08a;--err:#ff8a70;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#23262c;--text:#f5f5f7;--muted:#a1a1a8;--sh-d:#16181c;--sh-l:#30343c;--accent:#ffab66;--ok:#5fd08a;--err:#ff8a70;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font:400 15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:24px 60px;display:flex;flex-direction:column;gap:28px}
h1,h2{margin:0;letter-spacing:-.02em;line-height:1.1}
h1{font-size:1.9rem;font-weight:700}h2{font-size:1.35rem;font-weight:700;margin-bottom:14px}
.label{font-size:.78rem;font-weight:600;color:var(--muted)}
a.label{text-decoration:none;padding:8px 14px;border-radius:999px;box-shadow:var(--raise-sm)}
input,select,textarea,button{font:inherit}
input,select,textarea{padding:10px 13px;border:0;border-radius:12px;background:var(--bg);color:var(--text);box-shadow:var(--inset-sm);width:100%;outline:none}
input:focus,select:focus{box-shadow:var(--inset-sm),0 0 0 2px color-mix(in srgb,var(--accent) 55%,transparent)}
button{padding:9px 15px;border:0;border-radius:999px;background:var(--bg);color:var(--text);box-shadow:var(--raise-sm);cursor:pointer;font-weight:600}
button:active{box-shadow:var(--inset-sm)}
button.p{background:var(--grad);color:#1d1d1f}
button[aria-pressed="true"]{box-shadow:var(--inset-sm);color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.card{border-radius:24px;box-shadow:var(--raise);padding:20px;display:flex;flex-direction:column;gap:10px}
.box{border-radius:28px;box-shadow:var(--raise);padding:24px}
.card.cancelled{opacity:.55}
.when{font-weight:700}
.pill{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:4px 9px;border-radius:999px;box-shadow:var(--inset-sm)}
.pill.pending{color:var(--accent)}.pill.confirmed{color:var(--ok)}.pill.paid{color:var(--text)}
dl{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin:0;font-size:.92rem}
dt{color:var(--muted)}dd{margin:0;overflow-wrap:anywhere}
.list{display:flex;flex-direction:column;gap:16px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:10px}
.slots button{padding:9px 2px;border-radius:12px;font-variant-numeric:tabular-nums}
.slots .booked{box-shadow:none;opacity:.45;cursor:default}
.prices{display:grid;grid-template-columns:1.6fr 1fr 1fr;gap:10px 14px;align-items:center}
.msg{font-weight:600;color:var(--err);min-height:1.4em}
</style>
<div class="wrap">
  <div class="row" style="justify-content:space-between"><h1>The DogMan · Admin</h1><span class="row"><a href="/walk/" class="label">🐾 Walk mode</a><a href="/" class="label">← Site</a></span></div>
  <form id="login" class="box" style="max-width:380px;display:flex;flex-direction:column;gap:12px" style="max-width:360px"><label class="label" for="pw">Admin password</label><input id="pw" type="password" autocomplete="current-password"><button class="p" type="submit">Log in</button><div class="msg" id="login-msg"></div></form>
  <div id="app" hidden style="display:flex;flex-direction:column;gap:26px">
    <div class="msg" id="msg" role="status"></div>
    <div><h2>Bookings</h2>
      <div class="row" style="margin-block:10px" id="filters"></div>
      <div class="list" id="bookings"></div></div>
    <div class="box"><h2>Members</h2><div class="row" style="margin-bottom:12px" id="m-filters"></div><div class="list" id="members"></div></div>
    <div class="box"><h2>Add a booking</h2>
      <form id="add" class="grid" style="margin-top:10px">
        <div class="f"><label class="label" for="a-service">Service</label><select id="a-service"></select></div>
        <div class="f"><label class="label" for="a-date">Date</label><input id="a-date" type="date" required></div>
        <div class="f"><label class="label" for="a-time">Time (walks)</label><select id="a-time"></select></div>
        <div class="f"><label class="label" for="a-nights">Nights / days</label><input id="a-nights" type="number" min="1" max="30" value="1"></div>
        <div class="f"><label class="label" for="a-pets">Pets</label><input id="a-pets" type="number" min="1" max="6" value="1"></div>
        <div class="f"><label class="label" for="a-name">Owner name</label><input id="a-name" required></div>
        <div class="f"><label class="label" for="a-phone">Phone</label><input id="a-phone" required></div>
        <div class="f"><label class="label" for="a-dog">Pet's name</label><input id="a-dog"></div>
        <div class="f"><label class="label" for="a-address">Address</label><input id="a-address"></div>
        <div class="f"><label class="label" for="a-notes">Notes</label><input id="a-notes"></div>
        <div class="f" style="justify-content:flex-end"><button class="p" type="submit">Add booking</button></div>
      </form></div>
    <div class="box"><h2>Block times</h2>
      <div class="row" style="margin-block:10px"><input id="b-date" type="date" style="max-width:190px" aria-label="Date"><button type="button" id="b-day"></button></div>
      <div class="slots" id="b-slots"></div><p class="label" style="margin-top:8px">Tap a free time to block it. Tap again to open it.</p></div>
    <div class="box"><h2>Settings</h2>
      <form id="cfg" class="grid" style="margin-top:10px">
        <div class="f" style="grid-column:1/-1"><span class="label">Membership plans</span><div class="prices" id="c-plans" style="grid-template-columns:1.6fr 1fr 1fr auto"></div></div>
        <div class="f" style="grid-column:1/-1"><div class="prices" id="c-prices"></div><p class="label" style="margin-top:6px">Prices in kr. Leave empty for "price on request" / no extra-pet charge.</p></div>
        <div class="f"><label class="label" for="c-start">First time (hour)</label><input id="c-start" type="number" min="0" max="23"></div>
        <div class="f"><label class="label" for="c-end">Closing hour</label><input id="c-end" type="number" min="1" max="24"></div>
        <div class="f"><label class="label" for="c-mp">MobilePay number</label><input id="c-mp"></div>
        <div class="f"><label class="label" for="c-phone">Phone shown on site</label><input id="c-phone"></div>
        <div class="f"><label class="label" for="c-paw">Pawshake link</label><input id="c-paw"></div>
        <div class="f" style="grid-column:1/-1"><label class="label" for="c-gid">Google client ID (for "Sign in with Google")</label><input id="c-gid" placeholder="1234-abc.apps.googleusercontent.com"></div>
        <div class="f" style="grid-column:1/-1"><span class="label">Open days</span><div class="row" id="c-days"></div></div>
        <div class="f"><button class="p" type="submit">Save settings</button></div>
      </form></div>
  </div>
</div>
<script>
const $=(id)=>document.getElementById(id);const pad=(n)=>String(n).padStart(2,'0');
const NAMES={boarding:'Dog boarding',daycare:'Doggy day care',housesit:'House sitting',visit1:'One home visit a day',visit2:'Two home visits a day',walk:'Dog walking',visit:'Home visit'};
const UNIT={nights:'night',days:'day',slot:'walk'};
let pw='';try{pw=sessionStorage.getItem('pw')||''}catch(e){}
let D=null,filter='upcoming',openDays=[];
async function api(body){const r=await fetch('/api/admin',{method:body?'POST':'GET',headers:{'Content-Type':'application/json','x-admin-password':pw},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'server');D=j;return j}
const ERR={member:'Member not found.',plan:'That plan is not available.',taken:'That time is already taken.',auth:'Wrong password.',contact:'Name and an 8-digit phone number are required.',time:'Pick a time inside opening hours.',date:'Pick a valid date.'};
async function act(body){$('msg').textContent='';try{await api(body);render()}catch(e){$('msg').textContent=ERR[e.message]||'Could not save: '+e.message}}
function el(tag,props,...kids){const e=document.createElement(tag);Object.assign(e,props||{});e.append(...kids);return e}
const PLAN_NAMES={flex10:'10-walk card',weekly2:'Weekly walker (8/month)',daily5:'Every weekday (22/month)',alfa:'Premium Alfa (22 solo/month)'};
const ACTIONS={requested:'requested',paid:'paid',used:'used',refund:'refund',adjusted:'adjusted',notRenewing:'will not renew',withdrawn:'withdrew request',cancelledByAdmin:'cancelled by you'};
let mfilter='active';
function memberCard(m){const ms=m.membership,plan=D.config.plans.find(p=>p.id===(ms.request||ms.plan))||{},active=ms.status==='active'&&ms.end>=D.today;
  const status=active?'active':ms.status==='pending'?'pending':'ended';
  const pills=[el('span',{className:'pill '+(status==='active'?'confirmed':status==='pending'?'pending':'cancelled'),textContent:status})];
  if(active&&ms.autoRenew===false)pills.push(el('span',{className:'pill',textContent:'not renewing'}));
  if(ms.request&&active)pills.push(el('span',{className:'pill pending',textContent:'wants '+(PLAN_NAMES[ms.request]||ms.request)}));
  const rows=[['Plan',PLAN_NAMES[ms.plan]||ms.plan],['Credits',active?String(ms.credits||0):''],['Period',ms.start&&ms.end?ms.start+' → '+ms.end:''],['Phone',m.phone],['Email',m.email],
    ['History',(ms.history||[]).slice(-5).reverse().map(h=>h.at.slice(0,10)+' '+(ACTIONS[h.action]||h.action)+(h.credits?' ('+(h.credits>0?'+':'')+h.credits+')':'')+(h.price?' '+h.price+' kr.':'')).join(' · ')]].filter(r=>r[1]);
  const dl=el('dl',{});rows.forEach(r=>dl.append(el('dt',{textContent:r[0]}),el('dd',{textContent:r[1]})));
  const b=(txt,body,cls)=>{const x=el('button',{type:'button',textContent:txt,className:cls||''});x.onclick=()=>act({sub:m.sub,...body});return x};
  const actions=el('div',{className:'row'});
  if(plan.id)actions.append(b((active&&!ms.request?'Renew – paid ':'Mark paid ')+plan.price+' kr.',{action:'member-pay'},'p'));
  if(active)actions.append(b('+1 credit',{action:'member-credits',delta:1}),b('−1 credit',{action:'member-credits',delta:-1}));
  if(status!=='ended')actions.append(b('Cancel membership',{action:'member-cancel'}));
  return el('div',{className:'card'},el('div',{className:'row',style:'justify-content:space-between'},el('span',{className:'when',textContent:(m.name||m.email)}),el('span',{className:'row'},...pills)),dl,actions)}
function render(){
  $('login').hidden=true;$('app').hidden=false;
  const mem=D.members||[],mstate=(x)=>x.membership.status==='active'&&x.membership.end>=D.today?'active':x.membership.status==='pending'?'pending':'ended';
  $('m-filters').replaceChildren(...['active','pending','ended'].map(f=>{const n=mem.filter(x=>mstate(x)===f).length;const b=el('button',{type:'button',textContent:f[0].toUpperCase()+f.slice(1)+' ('+n+')'});b.setAttribute('aria-pressed',f===mfilter);b.onclick=()=>{mfilter=f;render()};return b}));
  const ml=mem.filter(x=>mstate(x)===mfilter);
  $('members').replaceChildren(...(ml.length?ml.map(memberCard):[el('p',{className:'label',textContent:'No members here yet.'})]));
  $('filters').replaceChildren(...['upcoming','pending','all'].map(f=>{const b=el('button',{type:'button',textContent:f[0].toUpperCase()+f.slice(1)+(f==='pending'?' ('+D.bookings.filter(x=>x.status==='pending').length+')':'')});b.setAttribute('aria-pressed',f===filter);b.onclick=()=>{filter=f;render()};return b}));
  const list=D.bookings.filter(b=>filter==='all'||(filter==='pending'?b.status==='pending':b.date>=D.today&&b.status!=='cancelled'));
  $('bookings').replaceChildren(...(list.length?list.map(card):[el('p',{className:'label',textContent:'No bookings here yet.'})]));
  if(!$('b-date').value)$('b-date').value=D.today;if(!$('a-date').value)$('a-date').value=D.today;
  const hrs=[];for(let h=D.config.hours.start;h<D.config.hours.end;h++)hrs.push(pad(h)+':00');
  const cur=$('a-time').value;$('a-time').replaceChildren(...hrs.map(h=>el('option',{value:h,textContent:h})));if(hrs.includes(cur))$('a-time').value=cur;
  const d=$('b-date').value,closed=D.config.closedDates.includes(d);$('b-day').textContent=closed?'Open this whole day':'Close this whole day';
  $('b-slots').replaceChildren(...hrs.map(h=>{const k=d+'|'+h,bk=D.bookings.find(b=>b.status!=='cancelled'&&b.date===d&&b.time===h),bl=D.blocked.includes(k);
    const b=el('button',{type:'button',textContent:h,title:bk?bk.name:''});if(bk){b.className='booked';b.disabled=true}else{b.setAttribute('aria-pressed',bl);b.onclick=()=>act({action:bl?'unblock':'block',key:k})}return b}));
}
// "Mon 12 Oct 09:00 · Tue 13 Oct …", "Every Mon, Thu 07:00 from 12 Oct (16×)", "20 Oct → 23 Oct (3 nights)"
const WDN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const dshort=(d)=>new Date(d+'T12:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
function whenOf(b){const tm=b.time?' '+b.time:'';
  if(b.end)return dshort(b.date)+' → '+dshort(b.end)+' ('+b.nights+' nights)';
  if(b.plan==='weekly')return 'Every '+(b.weekdays||[]).map(n=>WDN[n]).join(', ')+tm+' from '+dshort(b.date)+' ('+(b.dates||[]).length+'×)';
  const ds=b.dates&&b.dates.length?b.dates:[b.date];return ds.map(dshort).join(' · ')+tm}
function card(b){
  const pills=[el('span',{className:'pill '+b.status,textContent:b.status})];if(b.paid)pills.push(el('span',{className:'pill paid',textContent:'paid'}));if(b.user)pills.push(el('span',{className:'pill',textContent:'google'}));
  const rows=[['Owner',b.name],['Phone',b.phone],['Email',b.email],['Address',b.address],['Pets',(b.petList&&b.petList.length?b.petList.map(p=>[p.name||'(no name)',p.type,p.size,p.breed].filter(Boolean).join(' ')).join(' · '):[b.dog,b.breed,b.size,b.pets>1?b.pets+' pets':''].filter(Boolean).join(' · '))],['Meet & greet',b.meet?'Yes – wants a free meeting first':''],['GPS walks',Object.entries(b.walks||{}).map(([d,w])=>d.slice(5)+': '+w.km+' km/'+w.minutes+' min').join(' · ')],['Estimate',b.estimate!=null?b.estimate+' kr.':''],['How often',{weekly:'Every week',multi:'Several times a week'}[b.freq]||''],['Notes',b.notes],['Booked',b.created.slice(0,10)+' via '+b.source]].filter(r=>r[1]);
  const dl=el('dl',{});rows.forEach(r=>{const dd=el('dd',{});if(r[0]==='Address')dd.append(el('a',{href:'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(r[1]),target:'_blank',rel:'noopener',textContent:r[1]+' ↗'}));else dd.textContent=r[1];dl.append(el('dt',{textContent:r[0]}),dd)});
  const btn=(txt,body,cls)=>{const x=el('button',{type:'button',textContent:txt,className:cls||''});x.onclick=()=>act({id:b.id,...body});return x};
  const actions=el('div',{className:'row'});
  if(b.status==='pending')actions.append(btn('Confirm',{action:'status',status:'confirmed'},'p'));
  if(b.status!=='cancelled')actions.append(btn(b.paid?'Mark unpaid':'Mark paid',{action:'paid',paid:!b.paid}),btn('Cancel',{action:'status',status:'cancelled'}));
  else{const del=el('button',{type:'button',textContent:'Delete'});del.onclick=()=>{if(del.dataset.sure)act({action:'delete',id:b.id});else{del.dataset.sure=1;del.textContent='Delete for good?'}};actions.append(btn('Restore',{action:'status',status:'confirmed'}),del)}
  return el('div',{className:'card '+b.status},el('div',{className:'row',style:'justify-content:space-between'},el('span',{className:'when',textContent:NAMES[b.service]+' · '+whenOf(b)}),el('span',{className:'row'},...pills)),dl,actions);
}
function fillCfg(){const c=D.config;
  $('c-plans').replaceChildren(el('span',{className:'label',textContent:'Plan'}),el('span',{className:'label',textContent:'Walks per period'}),el('span',{className:'label',textContent:'Price (kr.)'}),el('span',{className:'label',textContent:'On sale'}),
    ...c.plans.flatMap(p=>[el('span',{textContent:(PLAN_NAMES[p.id]||p.id)+' · '+(p.kind==='pack'?p.months+' months':'per month')}),el('input',{id:'p-'+p.id+'-w',type:'number',min:1,value:p.walks}),el('input',{id:'p-'+p.id+'-p',type:'number',min:0,value:p.price}),el('input',{id:'p-'+p.id+'-a',type:'checkbox',checked:!!p.active,style:'width:22px;height:22px;box-shadow:none'})]));
  $('a-service').replaceChildren(...c.services.map(s=>el('option',{value:s.id,textContent:NAMES[s.id]||s.id})));$('a-service').value='walk';
  $('c-prices').replaceChildren(el('span',{className:'label',textContent:'Service'}),el('span',{className:'label',textContent:'Price'}),el('span',{className:'label',textContent:'+ per extra pet'}),...c.services.flatMap(s=>[el('span',{textContent:NAMES[s.id]+' (per '+UNIT[s.mode]+')'}),el('input',{id:'c-'+s.id,type:'number',min:0,value:s.price??'',ariaLabel:NAMES[s.id]+' price'}),el('input',{id:'c-'+s.id+'-x',type:'number',min:0,value:s.extra??'',ariaLabel:NAMES[s.id]+' extra pet'})]));$('c-start').value=c.hours.start;$('c-end').value=c.hours.end;$('c-mp').value=c.mobilepay;$('c-phone').value=c.phone;$('c-paw').value=c.pawshake;$('c-gid').value=c.googleClientId||'';openDays=[...c.openDays];days()}
function days(){$('c-days').replaceChildren(...['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map((n,i)=>{const b=el('button',{type:'button',textContent:n});b.setAttribute('aria-pressed',openDays.includes(i));b.onclick=()=>{openDays=openDays.includes(i)?openDays.filter(x=>x!==i):[...openDays,i];days()};return b}))}
function cfgBody(closedDates){const c=D.config;return{action:'config',config:{services:c.services.map(s=>({id:s.id,price:$('c-'+s.id).value,extra:$('c-'+s.id+'-x').value})),plans:c.plans.map(p=>({id:p.id,walks:$('p-'+p.id+'-w').value,price:$('p-'+p.id+'-p').value,active:$('p-'+p.id+'-a').checked})),hours:{start:$('c-start').value,end:$('c-end').value},openDays,closedDates:closedDates||c.closedDates,mobilepay:$('c-mp').value.trim(),phone:$('c-phone').value.trim(),pawshake:$('c-paw').value.trim(),googleClientId:$('c-gid').value.trim()}}}
$('cfg').onsubmit=async(e)=>{e.preventDefault();await act(cfgBody());fillCfg();if(!$('msg').textContent){$('msg').style.color='var(--ok)';$('msg').textContent='Settings saved.';setTimeout(()=>{$('msg').textContent='';$('msg').style.color=''},2500)}};
$('b-date').onchange=render;
$('b-day').onclick=()=>{const d=$('b-date').value,c=D.config.closedDates;act(cfgBody(c.includes(d)?c.filter(x=>x!==d):[...c,d]))};
$('add').onsubmit=async(e)=>{e.preventDefault();const v=(id)=>$('a-'+id).value.trim();
  await act({action:'add',booking:{service:v('service'),date:v('date'),time:v('time'),nights:v('nights'),days:v('nights'),pets:v('pets'),name:v('name'),phone:v('phone'),dog:v('dog'),address:v('address'),notes:v('notes')}});
  if(!$('msg').textContent)['name','phone','dog','address','notes'].forEach(k=>$('a-'+k).value='')};
async function start(){try{await api();try{sessionStorage.setItem('pw',pw)}catch(e){}fillCfg();render()}catch(e){$('login').hidden=false;$('app').hidden=true;if(pw)$('login-msg').textContent=e.message==='auth'?'Wrong password.':'Admin is not available: '+e.message;pw=''}}
$('login').onsubmit=(e)=>{e.preventDefault();pw=$('pw').value;$('login-msg').textContent='';start()};
if(pw)start();
</script>
